name: Build and release Codex 离线时区同步

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_VERSION: 0.7.3

jobs:
  build:
    name: Native ABI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-24.04
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
          - platform: darwin_amd64
            runner: macos-15-intel
          - platform: darwin_arm64
            runner: macos-15
          - platform: windows_amd64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tzdata for the table validation test
        run: python -m pip install tzdata
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
      - name: Validate the committed timezone table against tzdata
        run: python test_timezone_rules.py
      - name: Embed management panel
        run: python embed_ui.py
      - name: Build and run plugin tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: make test PYTHON=python
      - name: Build plugin (Windows UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: >-
          gcc -O2 -std=c11 -Wall -Wextra -Werror -shared -o codex-timezone-sync-local.dll
          plugin.c settings.c events.c json.c rewrite.c timezone.c platform.c
          -static-libgcc -lws2_32
      - name: Run plugin tests (Windows)
        if: runner.os == 'Windows'
        run: python test_plugin.py
      - name: Assemble CPA-compatible plugin ZIP
        run: python package_release.py ${{ env.PLUGIN_VERSION }} ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          merge-multiple: true
          path: dist
      - name: Generate and verify five-platform checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${PLUGIN_VERSION}"
          test "${GITHUB_REF_NAME}" = "v${version}"
          cd dist
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64; do
            test -s "codex-timezone-sync-local_${version}_${platform}.zip"
          done
          test "$(find . -name '*.zip' -type f | wc -l)" -eq 5
          sha256sum *.zip > checksums.txt
          sha256sum -c checksums.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'NOTES'
          Codex 时区同步插件。内置离线 IANA 时区表，管理面板直接选择本地与目标时区，无需宿主机辅助服务、状态文件或外网访问。支持 Linux amd64 / arm64、macOS Intel / Apple Silicon 和 Windows amd64。

          v0.7.3 修复了容器重启后设置回到默认值的问题：配置改写到宿主可执行文件目录下的 plugins 子目录（容器部署即 `/CLIProxyAPI/plugins`），该目录在部署时通常已挂载为卷。面板底部会显示实际使用的配置文件路径，也可用 `CODEX_TZ_CONFIG_DIR` 或 `CODEX_TZ_CONFIG_FILE` 指定位置。
          NOTES
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt \
            --title "Codex 离线时区同步 ${GITHUB_REF_NAME}" \
            --notes-file notes.md
