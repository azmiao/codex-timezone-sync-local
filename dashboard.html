<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Codex Timezone Sync</title>
<style>
:root{color-scheme:dark;--bg:#121110;--card:#1b1a18;--line:#4a4235;--sub:#a9a49c;--text:#f1f0ee;--gold:#edb858;--green:#43d98b;--red:#f58b79}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#211f1b 0%,var(--bg) 62%);font:15px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);min-height:100vh}
button,select,input{font:inherit}
button{cursor:pointer}
button:disabled,select:disabled,input:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;padding:28px 24px 40px}
header{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.symbol{width:56px;height:56px;flex:none;color:var(--gold)}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:24px;margin:0;font-weight:700}
.subtitle{color:var(--sub);font-size:14px}
.auth{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid #3a352c;border-radius:12px;padding:12px 14px;margin-bottom:16px;background:#1e1c19}
.auth label{font-weight:600;white-space:nowrap}
.auth input{flex:1;min-width:140px;max-width:340px;background:#141310;color:#fff;border:1px solid #4a443a;border-radius:8px;padding:9px 12px}
.auth .helper{color:var(--sub);font-size:13px;flex:1;min-width:100%}
.auth .connected{color:var(--green)}
.panel{border:1px solid var(--line);background:linear-gradient(150deg,#1a1917,#201e1b);border-radius:13px;padding:20px 22px;margin-bottom:16px}
.panel h2{font-size:16px;margin:0 0 14px;font-weight:700;color:#e6e2dc}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{border:1px solid #3d372e;border-radius:11px;padding:16px;background:#232019}
.card strong{display:block;font-size:13px;color:var(--sub);margin-bottom:8px;font-weight:600;letter-spacing:.4px}
select{width:100%;background:#141310;color:#fff;border:1px solid #4a443a;border-radius:8px;padding:10px 12px}
select:disabled{background:#1b1a18}
.readout{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:12px;font-size:13px}
.readout span{color:var(--sub)}
.readout b{font-weight:600;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.toggle input{position:absolute;opacity:0;width:0;height:0}
.track{width:46px;height:26px;border-radius:14px;background:#4a4a4a;border:1px solid #6d6d6d;position:relative;transition:background .15s;flex:none}
.track::after{content:"";position:absolute;width:20px;height:20px;margin:2px;border-radius:50%;background:#fbfbfb;transition:transform .15s;box-shadow:0 1px 3px #0006}
.toggle input:checked+.track{background:linear-gradient(100deg,#f3be59,#cc963e);border-color:#f3c265}
.toggle input:checked+.track::after{transform:translateX(20px)}
.toggle input:disabled+.track{opacity:.5}
button.action{background:linear-gradient(110deg,#f6c864,#c99142);color:#201408;border:1px solid #eec06c;border-radius:9px;padding:10px 18px;font-weight:700}
button.action:hover{filter:brightness(1.07)}
button.ghost{background:transparent;border:1px solid #6b655c;color:#eee;border-radius:9px;padding:9px 16px;font-weight:600}
button.ghost:hover{border-color:var(--gold);color:var(--gold)}
.feedback{margin-top:12px;min-height:22px;font-size:13px;color:var(--gold)}
.feedback.error{color:var(--red)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-weight:600;color:#cdc8c1;background:#282521;padding:9px 12px;white-space:nowrap}
.table th:first-child{border-radius:8px 0 0 8px}
.table th:last-child{border-radius:0 8px 8px 0}
.table td{padding:9px 12px;border-bottom:1px solid #35322e;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.table tr:last-child td{border-bottom:0}
.table .empty{text-align:center;color:var(--sub);padding:26px}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid}
.badge.ok{color:var(--green);border-color:#2f6b4b;background:#152a20}
.badge.warn{color:var(--gold);border-color:#6b5a2f;background:#2a2415}
.badge.bad{color:var(--red);border-color:#6b3a2f;background:#2a1715}
footer{color:#7d766c;font-size:12px;text-align:right;margin-top:18px}
pre{margin:0;white-space:pre-wrap;word-break:break-word;background:#100f0e;border:1px solid #35322e;border-radius:8px;padding:12px;font-size:12px;max-height:260px;overflow:auto}
@media(max-width:720px){.app{padding:18px 14px}.grid{grid-template-columns:1fr}h1{font-size:20px}.table td,.table th{padding:8px}.table td:nth-child(4),.table th:nth-child(4){display:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="symbol" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="28" cy="28" r="20"/><path d="M8 28h40M28 8c-13 11-14 28 0 40M28 8c12 9 13 24 6 35"/><circle cx="44" cy="44" r="13" fill="#191713"/><path d="M44 36v9l6 4"/></svg></div>
    <div>
      <h1>Codex Timezone Sync</h1>
      <div class="subtitle">离线时区校正 · 选择本地与目标时区即可</div>
    </div>
  </header>

  <section class="auth" aria-label="管理接口连接">
    <label for="management-key">管理密钥</label>
    <input id="management-key" type="password" autocomplete="off" placeholder="输入 CPA Management Key">
    <button id="connect" class="ghost">连接</button>
    <div id="connection" class="helper" role="status">优先复用 CPA 管理界面已记住的凭据；插件不存储密钥。</div>
  </section>

  <section class="panel">
    <div class="row" style="margin-bottom:14px">
      <h2 style="margin:0">时区设置</h2>
      <div style="display:flex;gap:10px">
        <button id="save" class="action">保存设置</button>
      </div>
    </div>
    <div class="grid">
      <div class="card">
        <strong>本地时区（请求中的原时区）</strong>
        <select id="local-zone" aria-label="本地时区"></select>
        <div class="readout">
          <span>当前时间</span><b id="local-time">—</b>
          <span>偏移</span><b id="local-offset">—</b>
        </div>
      </div>
      <div class="card">
        <strong>目标时区（写入请求的时区）</strong>
        <select id="target-zone" aria-label="目标时区"></select>
        <div class="readout">
          <span>当前时间</span><b id="target-time">—</b>
          <span>偏移</span><b id="target-offset">—</b>
        </div>
      </div>
    </div>
    <div class="row" style="margin-top:16px">
      <label class="toggle"><input id="toggle-sync" type="checkbox"><span class="track"></span><span>启用时区改写</span></label>
      <label class="toggle"><input id="toggle-log" type="checkbox"><span class="track"></span><span>记录最近改写</span></label>
    </div>
    <div id="feedback" class="feedback" role="status"></div>
  </section>

  <section class="panel">
    <div class="row" style="margin-bottom:12px">
      <h2 style="margin:0">校验</h2>
      <div style="display:flex;gap:8px">
        <button id="selftest" class="ghost">运行自检</button>
        <button id="refresh" class="ghost">刷新状态</button>
      </div>
    </div>
    <pre id="selftest-output" hidden></pre>
    <div id="selftest-hint" class="feedback">自检会用一条样例请求演练改写，不会发送到上游。</div>
  </section>

  <section class="panel">
    <div class="row" style="margin-bottom:12px">
      <h2 style="margin:0">最近改写</h2>
      <button id="clear-events" class="ghost">清空记录</button>
    </div>
    <table class="table">
      <thead><tr><th>时间</th><th>结果</th><th>原时区</th><th>目标时区</th><th>日期</th></tr></thead>
      <tbody id="events-body"><tr><td class="empty" colspan="5">暂无记录</td></tr></tbody>
    </table>
  </section>

  <footer id="updated">未连接管理接口</footer>
</div>
<script>
'use strict';
(() => {
  const base='/v0/management/plugins/codex-timezone-sync/';
  const $=id=>document.getElementById(id);
  let key='';
  let zones=[];
  let status=null;

  function rememberedKey(){
    try {
      const stored=localStorage.getItem('cli-proxy-auth');
      if(!stored)return '';
      let decoded=stored;
      if(stored.startsWith('enc::v1::')){
        const bytes=Uint8Array.from(atob(stored.slice(9)),c=>c.charCodeAt(0));
        const secret=new TextEncoder().encode('cli-proxy-api-webui::secure-storage|'+location.host+'|'+navigator.userAgent);
        decoded=new TextDecoder('utf-8',{fatal:true}).decode(bytes.map((b,i)=>b^secret[i%secret.length]));
      }
      const state=JSON.parse(decoded)?.state;
      return state?.rememberPassword===true && typeof state.managementKey==='string'?state.managementKey:'';
    } catch { return ''; }
  }

  function feedback(message,error=false){
    const node=$('feedback');
    node.textContent=message;
    node.className=error?'feedback error':'feedback';
  }

  async function api(endpoint,method='GET',data=null){
    if(!key)throw new Error('请先输入管理密钥并连接');
    const options={method,cache:'no-store',headers:{Authorization:'Bearer '+key}};
    if(data!==null){options.headers['Content-Type']='application/json';options.body=JSON.stringify(data);}
    const response=await fetch(base+endpoint,options);
    if(!response.ok){
      if(response.status===401||response.status===403)throw new Error('管理密钥无效或没有访问权限');
      const detail=await response.json().catch(()=>null);
      throw new Error(detail?.reason||detail?.error||'请求失败（HTTP '+response.status+'）');
    }
    return response.json();
  }

  function zoneOptions(select,selected){
    if(!select.options.length){
      const fragment=document.createDocumentFragment();
      for(const zone of zones){
        const option=document.createElement('option');
        option.value=zone;
        option.textContent=zone;
        fragment.appendChild(option);
      }
      select.appendChild(fragment);
    }
    if(selected&&zones.includes(selected))select.value=selected;
  }

  function renderStatus(){
    if(!status)return;
    const settings=status.settings;
    zoneOptions($('local-zone'),settings.local_zone);
    zoneOptions($('target-zone'),settings.target_zone);
    $('toggle-sync').checked=!!settings.enabled;
    $('toggle-log').checked=!!settings.logging;
    for(const id of ['local-zone','target-zone','toggle-sync','toggle-log'])$(id).disabled=false;
    $('local-time').textContent=status.local.time?`${status.local.date} ${status.local.time}`:'—';
    $('local-offset').textContent=status.local.offset?`${status.local.abbreviation} · UTC${status.local.offset}`:'—';
    $('target-time').textContent=status.target.time?`${status.target.date} ${status.target.time}`:'—';
    $('target-offset').textContent=status.target.offset?`${status.target.abbreviation} · UTC${status.target.offset}`:'—';
    $('updated').textContent=`插件 v${status.version} · 内置 ${status.timezones} 个时区 · 更新于 ${new Date().toLocaleString('zh-CN')}`;
  }

  const labels={rewritten:['ok','已改写'],unchanged:['warn','无需改写'],failed:['bad','失败']};

  function renderEvents(events){
    const body=$('events-body');
    body.replaceChildren();
    if(!events.length){
      const row=document.createElement('tr');
      const cell=document.createElement('td');
      cell.className='empty';
      cell.colSpan=5;
      cell.textContent='暂无记录';
      row.appendChild(cell);
      body.appendChild(row);
      return;
    }
    for(const event of events){
      const row=document.createElement('tr');
      const kind=labels[event.result]||['warn',event.result];
      const values=[
        new Date(event.timestamp*1000).toLocaleString('zh-CN'),
        kind,
        event.timezone_from||'（无）',
        event.timezone_to||'—',
        event.date||'—',
      ];
      for(const [index,value] of values.entries()){
        const cell=document.createElement('td');
        if(index===1){
          const badge=document.createElement('span');
          badge.className='badge '+kind[0];
          badge.textContent=kind[1];
          cell.appendChild(badge);
        } else {
          cell.textContent=value;
        }
        row.appendChild(cell);
      }
      body.appendChild(row);
    }
  }

  async function loadEvents(){
    if(!key)return;
    try { renderEvents((await api('events')).events||[]); }
    catch (error) { feedback(error.message,true); }
  }

  async function refresh(){
    try {
      if(!zones.length)zones=(await api('timezones')).zones||[];
      status=await api('status');
      renderStatus();
      await loadEvents();
      $('connection').textContent='已连接管理接口';
      $('connection').className='helper connected';
      feedback('');
    } catch (error) {
      feedback(error.message,true);
      $('connection').textContent='未连接';
      $('connection').className='helper';
    }
  }

  async function guarded(task){
    try { feedback(''); await task(); }
    catch (error) { feedback(error.message,true); }
  }

  $('connect').addEventListener('click',()=>guarded(async()=>{
    key=$('management-key').value.trim()||rememberedKey();
    if(!key)throw new Error('请输入 CPA Management Key');
    $('management-key').value='';
    await refresh();
  }));

  $('management-key').addEventListener('keydown',event=>{
    if(event.key==='Enter')$('connect').click();
  });

  $('save').addEventListener('click',()=>guarded(async()=>{
    await api('settings','PUT',{
      enabled:$('toggle-sync').checked,
      logging:$('toggle-log').checked,
      local_zone:$('local-zone').value,
      target_zone:$('target-zone').value,
    });
    await refresh();
    feedback('设置已保存，下一次 Codex 请求立即生效。');
  }));

  $('refresh').addEventListener('click',()=>guarded(refresh));

  $('selftest').addEventListener('click',()=>guarded(async()=>{
    const result=await api('selftest','POST',{});
    const output=$('selftest-output');
    output.hidden=false;
    output.textContent=`目标时区：${result.target_zone}\n目标日期：${result.date}\n\n${result.sample||''}`;
    $('selftest-hint').textContent='自检通过：改写逻辑正常。';
  }));

  $('clear-events').addEventListener('click',()=>guarded(async()=>{
    await api('events/clear','POST',{});
    await loadEvents();
    feedback('记录已清空。');
  }));

  $('management-key').value=rememberedKey()?'':'';
  if(rememberedKey()){
    key=rememberedKey();
    refresh();
  }
})();
</script>
</body>
</html>
